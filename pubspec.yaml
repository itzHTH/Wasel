name: wasel_workspace
description: "Wasel monorepo root — rider & driver apps with shared packages."
publish_to: "none"

environment:
  sdk: ^3.10.8

# Dart pub workspace members. Each member declares `resolution: workspace`.
# Members are uncommented as the phases create them:
#   Phase 1 -> packages/core, Phase 2 -> packages/auth, Phase 3 -> apps/driver
workspace:
  - apps/rider
  - packages/core
  - packages/auth
  - apps/driver

dev_dependencies:
  melos: ^6.0.0
