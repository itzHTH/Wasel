name: wasel_core
description: "Shared core for the Wasel apps: networking, theming, helpers, widgets, flavors."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management (providers in core, e.g. dioFactory)
  riverpod_annotation: ^4.0.2

  # Networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.2.0

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0

  # Utils
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
