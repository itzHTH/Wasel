name: wasel_core
description: "Shared core for the Wasel apps: networking, theming, helpers, widgets, flavors."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management (providers in core, e.g. dioFactory)
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Networking
  signalr_netcore: ^1.4.4
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.2.0

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  pinput: ^6.0.2
  skeletonizer: ^2.1.3

  # Utils
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  flutter_dotenv: ^6.0.1

  # Permissions (shared gate reused by all apps/features)
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  generate: true

  # Bundled, so first launch has no network dependency and no fallback flash.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700

    # Live-updating numerals only — see AppFonts.numeralFamily. Only w600 is
    # reachable today; add a weight here when a call site needs one.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
