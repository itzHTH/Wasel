name: Patch Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rider
            keys_secret: RIDER_ENV_PROD_JSON
            keystore_secret: RIDER_KEYSTORE_BASE64
            store_pw_secret: RIDER_STORE_PASSWORD
            key_pw_secret: RIDER_KEY_PASSWORD
            alias_secret: RIDER_KEY_ALIAS
            maps_secret: RIDER_MAPS_API_KEY
            keystore_file: keystore.jks
          - app: driver
            keys_secret: DRIVER_ENV_PROD_JSON
            keystore_secret: DRIVER_KEYSTORE_BASE64
            store_pw_secret: DRIVER_STORE_PASSWORD
            key_pw_secret: DRIVER_KEY_PASSWORD
            alias_secret: DRIVER_KEY_ALIAS
            maps_secret: DRIVER_MAPS_API_KEY
            keystore_file: keystore.p12
    concurrency:
      group: patch-${{ matrix.app }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: apps/${{ matrix.app }}/android/*.gradle*

      - name: Setup env
        env:
          ROOT_ENV: ${{ secrets.ROOT_ENV_PROD_JSON }}
          APP_KEYS: ${{ secrets[matrix.keys_secret] }}
        run: |
          set -euo pipefail
          printf '%s' "$ROOT_ENV" > env.prod.json
          printf '%s' "$APP_KEYS" > apps/${{ matrix.app }}/env.keys.json

      - name: Setup signing
        working-directory: apps/${{ matrix.app }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets[matrix.keystore_secret] }}
          STORE_PASSWORD: ${{ secrets[matrix.store_pw_secret] }}
          KEY_PASSWORD: ${{ secrets[matrix.key_pw_secret] }}
          KEY_ALIAS: ${{ secrets[matrix.alias_secret] }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/${{ matrix.keystore_file }}
          cat > key.properties <<EOF
          storeFile=${{ matrix.keystore_file }}
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Setup maps key
        working-directory: apps/${{ matrix.app }}/android
        env:
          MAPS_API_KEY: ${{ secrets[matrix.maps_secret] }}
        run: |
          set -euo pipefail
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > local.properties

      - name: Verify
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          ls -la ../../env.prod.json env.keys.json
          ls -la android/key.properties android/local.properties android/app/${{ matrix.keystore_file }}
          cat shorebird.yaml

      - name: Shorebird Patch Android
        working-directory: apps/${{ matrix.app }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          shorebird patch android \
            --flavor production -t lib/main_prod.dart \
            --release-version latest \
            --no-confirm \
            -- --dart-define-from-file=../../env.prod.json \
               --dart-define-from-file=env.keys.json
