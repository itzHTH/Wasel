name: Release Android

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rider
            keys_secret: RIDER_ENV_PROD_JSON
            keystore_secret: RIDER_KEYSTORE_BASE64
            store_pw_secret: RIDER_STORE_PASSWORD
            key_pw_secret: RIDER_KEY_PASSWORD
            alias_secret: RIDER_KEY_ALIAS
            maps_secret: RIDER_MAPS_API_KEY
            keystore_file: keystore.jks
            firebase_app_id_secret: RIDER_FIREBASE_APP_ID
          - app: driver
            keys_secret: DRIVER_ENV_PROD_JSON
            keystore_secret: DRIVER_KEYSTORE_BASE64
            store_pw_secret: DRIVER_STORE_PASSWORD
            key_pw_secret: DRIVER_KEY_PASSWORD
            alias_secret: DRIVER_KEY_ALIAS
            maps_secret: DRIVER_MAPS_API_KEY
            keystore_file: keystore.p12
            firebase_app_id_secret: DRIVER_FIREBASE_APP_ID
    concurrency:
      group: release-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::release.yml requires a tag of the form vX.Y.Z. Current ref: ${GITHUB_REF_NAME} (type: ${GITHUB_REF_TYPE}). Create and push a tag instead of dispatching from a branch."
            exit 1
          fi
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: apps/${{ matrix.app }}/android/*.gradle*

      - name: Setup env
        env:
          ROOT_ENV: ${{ secrets.ROOT_ENV_PROD_JSON }}
          APP_KEYS: ${{ secrets[matrix.keys_secret] }}
        run: |
          set -euo pipefail
          printf '%s' "$ROOT_ENV" > env.prod.json
          printf '%s' "$APP_KEYS" > apps/${{ matrix.app }}/env.keys.json

      - name: Setup signing
        working-directory: apps/${{ matrix.app }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets[matrix.keystore_secret] }}
          STORE_PASSWORD: ${{ secrets[matrix.store_pw_secret] }}
          KEY_PASSWORD: ${{ secrets[matrix.key_pw_secret] }}
          KEY_ALIAS: ${{ secrets[matrix.alias_secret] }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/${{ matrix.keystore_file }}
          cat > key.properties <<EOF
          storeFile=${{ matrix.keystore_file }}
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Setup maps key
        working-directory: apps/${{ matrix.app }}/android
        env:
          MAPS_API_KEY: ${{ secrets[matrix.maps_secret] }}
        run: |
          set -euo pipefail
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > local.properties

      - name: Verify
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          ls -la ../../env.prod.json env.keys.json
          ls -la android/key.properties android/local.properties android/app/${{ matrix.keystore_file }}
          cat shorebird.yaml

      - name: Shorebird Release Android
        working-directory: apps/${{ matrix.app }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          shorebird release android \
            --flavor production -t lib/main_prod.dart \
            --artifact apk --no-confirm \
            --build-name=${{ steps.v.outputs.name }} \
            --build-number=${{ github.run_number }} \
            -- --dart-define-from-file=../../env.prod.json \
               --dart-define-from-file=env.keys.json

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          BASE="apps/${{ matrix.app }}/build/app/outputs"
          APK="$BASE/flutter-apk/app-production-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find "$BASE" -type f -name 'app-production-release.apk' -print -quit)"
          fi
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "::error::No production release APK found under $BASE"
            find "$BASE" -type f -name '*.apk' || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Distribute
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_ID: ${{ secrets[matrix.firebase_app_id_secret] }}
          APK: ${{ steps.apk.outputs.path }}
          NOTES: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools appdistribution:distribute "$APK" \
            --app "$APP_ID" \
            --groups "CodeForgeTesters,ZimiruTesters" \
            --release-notes "$NOTES"

      - name: Remove service account key
        if: always()
        run: |
          set -euo pipefail
          rm -f "${{ github.workspace }}/sa.json"
