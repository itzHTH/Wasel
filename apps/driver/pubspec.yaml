name: driver
description: "Wasel driver app — built on the shared wasel_core / wasel_auth packages."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  wasel_core: any
  wasel_auth: any
  wasel_location: any
  wasel_profile: any
  wasel_payments: any
  wasel_rides: any

  # Firebase (no FCM yet — verification status is polled in driver_verification)
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.1.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Location, maps and route drawing all arrive through wasel_location, which is
  # the only package allowed to talk to geolocator / google_maps_flutter /
  # flutter_polyline_points. The native permission and API-key entries in
  # android/ and ios/ stay app-owned.

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Lcoalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI
  flutter_screenutil: ^5.9.3

  # Driver verification — manual camera capture + gallery picker (vehicle only)
  camera: ^0.12.0+1
  image_picker: ^1.2.2

  # For Files 
  cross_file: ^0.3.5+2

  # Utils
  geolocator: ^14.0.3
  flutter_foreground_task: ^11.0.1
  flutter_local_notifications: ^22.3.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the connection timeout without a real 15s wait, keeping the
  # controller tests deterministic.
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.6
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/map_styles/
    - shorebird.yaml
