name: driver
description: "Wasel driver app — built on the shared wasel_core / wasel_auth packages."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  wasel_core:
    path: ../../packages/core
  wasel_auth:
    path: ../../packages/auth

  # Firebase (no FCM yet — verification status is polled in driver_verification)
  firebase_core: ^4.8.0

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # UI
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.2

  # Driver verification — manual camera capture + gallery picker (vehicle only)
  camera: ^0.12.0+1
  image_picker: ^1.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
