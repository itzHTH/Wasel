name: driver
description: "Wasel driver app — built on the shared wasel_core / wasel_auth packages."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  wasel_core:
    path: ../../packages/core
  wasel_auth:
    path: ../../packages/auth
  wasel_location:
    path: ../../packages/wasel_location

  # Firebase (no FCM yet — verification status is polled in driver_verification)
  firebase_core: ^4.12.1

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Location
  geolocator: ^14.0.3

  # Maps — was reaching this transitively through wasel_core, which no longer
  # depends on it. Declared until the ride providers move onto the
  # wasel_location barrel.
  google_maps_flutter: ^2.17.1

  # Route drawing (Google Routes API)
  flutter_polyline_points: ^3.1.0

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  pinput: ^6.0.2

  # Driver verification — manual camera capture + gallery picker (vehicle only)
  camera: ^0.12.0+1
  image_picker: ^1.2.2

  cupertino_icons: ^1.0.8

  # For Files 
  cross_file: ^0.3.5+2

  # Navigation handoff to the installed map apps
  url_launcher: ^6.3.2

  # Utils
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the connection timeout without a real 15s wait, keeping the
  # controller tests deterministic.
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.6
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env
