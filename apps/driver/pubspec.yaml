name: driver
description: "Wasel driver app — built on the shared wasel_core / wasel_auth packages."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Shared packages (wasel_auth is added in Phase 4 when the auth UI consumes it)
  wasel_core:
    path: ../../packages/core

  # Firebase (no FCM yet — verification status is polled in driver_verification)
  firebase_core: ^4.8.0

  # State management
  flutter_riverpod: ^3.3.1

  # UI
  flutter_screenutil: ^5.9.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
