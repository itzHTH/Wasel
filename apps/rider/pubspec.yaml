name: wasal
description: "A Taxi client app for booking rides within local governorates."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  wasel_core: any
  wasel_auth: any
  wasel_location: any
  wasel_profile: any
  wasel_payments: any
  wasel_rides: any

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2

  # Maps, location and route drawing all arrive through wasel_location, which is
  # the only package allowed to talk to google_maps_flutter / geolocator /
  # flutter_polyline_points. The native permission and API-key entries in
  # android/ and ios/ stay app-owned.

  # Notifications & Firebase
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.1.0

  # Models & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utils
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  freezed: ^3.2.5
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3
  retrofit_generator: ^10.2.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/map_styles/
    - shorebird.yaml
