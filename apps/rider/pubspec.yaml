name: wasal
description: "A Taxi client app for booking rides within local governorates."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  wasel_core:
    path: ../../packages/core
  wasel_auth:
    path: ../../packages/auth
  wasel_location:
    path: ../../packages/wasel_location
  wasel_profile:
    path: ../../packages/wasel_profile
  wasel_payments:
    path: ../../packages/wasel_payments
  wasel_rides:
    path: ../../packages/wasel_rides

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # Maps, location and route drawing all arrive through wasel_location, which is
  # the only package allowed to talk to google_maps_flutter / geolocator /
  # flutter_polyline_points. The native permission and API-key entries in
  # android/ and ios/ stay app-owned.

  # Notifications & Firebase
  firebase_core: ^4.12.1

  # Models & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.2.0
  cached_network_image: ^3.4.1

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_rating_bar: ^4.0.1
  pinput: ^6.0.2
  google_fonts: ^8.1.0

  # Routing
  go_router: ^17.2.3

  # Localization
  intl: ^0.20.2

  # Utils
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

  # Code Generation
  freezed: ^3.2.5
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3
  retrofit_generator: ^10.2.6
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
  - assets/icons/
  - assets/map_styles/
  - .env
